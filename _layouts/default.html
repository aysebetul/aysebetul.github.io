<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>
  
  <body>
    <div class="wrapper-masthead">
      
      <div class="container">
        <nav style="float: none; width: 100%; display: flex; justify-content: center; gap: 25px; padding: 15px 0;">
          <a href="{{ site.baseurl }}/about">Home</a>
          <a href="{{ site.baseurl }}/publications">Publications</a>
          <a href="{{ site.baseurl }}/blog">Blog</a>
          <a href="{{ site.baseurl }}/cv">CV</a>
        </nav>
      </div>
      
      <div class="container">
        <header class="masthead clearfix" style="display: flex; align-items: center; gap: 30px;width: 100%;">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" style="width: 180px; height: 180px; object-fit: contain;" /></a>

          <div class="site-info" style="flex: 1; text-align: center;">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>
          
          
        </header>
      </div>
    </div>
    
    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
