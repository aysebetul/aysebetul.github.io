<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <div class="site-avatar-block">
            <a href="{{ site.baseurl }}/" class="site-avatar">
              <img src="{{ site.avatar }}" alt="Portrait of {{ site.name }}" />
            </a>

            <div class="site-profile-links" aria-label="Profile links">
              {% include svg-icons.html %}
            </div>
          </div>

          <div class="site-info">
            <h1 class="site-name">
              <a href="{{ site.baseurl }}/">{{ site.name }}</a>
            </h1>
            <p class="site-description">{{ site.description }}</p>
            <p class="site-email">
              <a href="mailto:aysebetulyuce@gmail.com">aysebetulyuce@gmail.com</a>
            </p>
          </div>
        </header>

        <nav class="site-navigation" aria-label="Main navigation">
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/publications/">Publications</a>
          <a href="{{ site.baseurl }}/blog/">Blog</a>
          <a href="{{ site.baseurl }}/cv/">CV</a>
        </nav>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          <p>© {{ site.time | date: "%Y" }} {{ site.name }}</p>
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
